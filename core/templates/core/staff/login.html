{% extends "core/staff/plain.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted" style="margin:0">Shop staff only.</p>
<form method="post" novalidate>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {% if form.errors %}<div class="err" role="alert">That username and password did not work. Check them and try again.</div>{% endif %}
  <label for="id_username">Username</label>
  <input type="text" id="id_username" name="username" value="{{ form.username.value|default_if_none:'' }}" autocomplete="username" autocapitalize="none" autocorrect="off" autofocus required>
  <label for="id_password">Password</label>
  <input type="password" id="id_password" name="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Sign in</button>
</form>
{% endblock %}
