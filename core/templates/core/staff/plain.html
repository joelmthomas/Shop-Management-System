{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Sign in{% endblock %} | Philips Autos</title>
<link rel="icon" href="{% static 'core/emblem.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2530;--red:#b3121e;--red-dark:#8c0e17;--paper:#efe9db;--card:#fbf8f1;--line:#d8d2c3;--muted:#5a6472;--navy:#22344a;--navy-deep:#1b2431}
*{box-sizing:border-box}
body{margin:0;font-family:'Barlow',system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.4;font-size:18px;min-height:100vh;display:flex;flex-direction:column}
h1{font-family:'Marcellus',Georgia,serif;font-weight:400;font-size:32px;margin:0 0 6px}
.check{height:20px;background:conic-gradient(var(--navy) 25%,var(--card) 0 50%,var(--navy) 0 75%,var(--card) 0) 0 0/20px 20px}
.top{background:var(--card);padding:14px 20px;display:flex;align-items:center;gap:12px}
.top img{height:52px;width:auto}
.top span{font-family:'Marcellus',Georgia,serif;font-size:24px;letter-spacing:.04em;color:var(--navy)}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 26px;width:100%;max-width:420px}
label{display:block;font-weight:700;font-size:16px;margin:16px 0 6px}
input[type=text],input[type=password]{width:100%;min-height:54px;padding:0 14px;border:2px solid #b9b3a3;border-radius:10px;font:500 19px 'Barlow',sans-serif;color:var(--ink);background:#fffdf8}
.btn,.btn2{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:10px;font:700 19px 'Barlow',sans-serif;border:0;cursor:pointer;text-decoration:none;margin-top:22px}
.btn{background:var(--red);color:#fff}.btn:hover{background:var(--red-dark)}
.btn2{background:var(--card);color:var(--navy);border:2px solid var(--navy)}
.err{background:#f3d3d0;color:#8a1c1c;border-radius:10px;padding:12px 14px;margin:16px 0 0;font-weight:600;font-size:16px}
.muted{color:var(--muted)}
input:focus-visible,.btn:focus-visible,.btn2:focus-visible{outline:3px solid #1a56db;outline-offset:2px}
</style>
</head>
<body>
<div class="top"><img src="{% static 'core/emblem.png' %}" alt=""><span>PHILIPS AUTOS</span></div>
<div class="check" aria-hidden="true"></div>
<main><div class="box">{% block content %}{% endblock %}</div></main>
</body>
</html>
